<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handraw 编号画廊 · 261 种手绘风格</title>
<style>
  :root{
    --paper:#fafaf8; --ink:#1a1a1a; --hair:#e6e4dd; --accent:#002FA7; --muted:#6b6b6b;
    --soft:#f4f2ec;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}

  header{position:sticky;top:0;background:var(--paper);
    border-bottom:1px solid var(--hair);padding:14px 32px;z-index:10;
    display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  header .brand{font-size:13px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink)}
  header .meta{font-size:11px;color:var(--muted)}
  header nav.anchors{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  header nav.anchors a{font-size:12px;font-weight:600;color:var(--muted);
    padding:5px 11px;border:1px solid var(--hair);transition:all .15s}
  header nav.anchors a:hover{color:var(--ink);border-color:var(--ink)}
  header nav.anchors a .n{font-weight:400;color:var(--muted);margin-left:4px;font-size:10px}

  main{padding:32px 32px 80px;max-width:1400px;margin:0 auto}
  section.section-block{margin-bottom:48px;scroll-margin-top:80px}
  section.section-block > h2{font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--accent);margin:0 0 4px}
  section.section-block > p.sub{font-size:12px;color:var(--muted);margin:0 0 16px}

  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .tile{cursor:pointer;background:#fff;border:1px solid var(--hair);
    transition:border-color .15s, transform .15s;overflow:hidden}
  .tile:hover{border-color:var(--ink);transform:translateY(-2px)}
  .tile .img-wrap{aspect-ratio:1;background:var(--soft);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    border-bottom:1px solid var(--hair);position:relative}
  .tile .img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .num-badge{position:absolute;top:6px;left:6px;
    background:rgba(255,255,255,.92);color:var(--ink);
    font-size:10px;font-weight:700;letter-spacing:.04em;
    padding:3px 6px;font-family:"SF Mono",Menlo,monospace}
  .tile .name{font-size:11px;font-weight:500;color:var(--ink);
    padding:8px 10px;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .lb{position:fixed;inset:0;background:rgba(250,250,248,.97);
    backdrop-filter:blur(6px);z-index:100;display:none;
    align-items:center;justify-content:center;padding:40px}
  .lb.open{display:flex}
  .lb .close{position:fixed;top:20px;right:24px;font-size:24px;
    color:var(--muted);cursor:pointer;background:none;border:0;
    width:40px;height:40px;line-height:1}
  .lb .close:hover{color:var(--ink)}
  .lb-panel{display:grid;grid-template-columns:1fr 1fr;gap:48px;max-width:1100px;
    width:100%;background:var(--paper);padding:40px;border:1px solid var(--hair);
    max-height:88vh;overflow-y:auto}
  .lb-img{aspect-ratio:1;background:var(--soft);border:1px solid var(--hair);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .lb-img img{max-width:100%;max-height:100%;display:block}
  .lb-meta .num{font-size:13px;color:var(--muted);letter-spacing:.04em;font-weight:500;margin-bottom:6px;
    font-family:"SF Mono",Menlo,monospace}
  .lb-meta .name{font-size:32px;font-weight:300;line-height:1.15;margin-bottom:8px}
  .lb-meta .author{font-size:13px;color:var(--muted);margin-bottom:24px}
  .lb-meta .prompt-block{border-top:1px solid var(--hair);padding-top:20px;margin-bottom:16px}
  .lb-meta .label{font-size:10px;font-weight:700;letter-spacing:.08em;
    color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .lb-meta pre{font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
    margin:0 0 8px;color:var(--ink);background:transparent;padding:0}
  .lb-nav{position:fixed;top:50%;transform:translateY(-50%);
    width:44px;height:44px;background:#fff;border:1px solid var(--hair);
    cursor:pointer;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .lb-nav:hover{border-color:var(--ink)}
  .lb-prev{left:20px}
  .lb-next{right:20px}

  @media (max-width:760px){
    header{padding:12px 16px;gap:12px}
    main{padding:20px 16px 60px}
    .lb-panel{grid-template-columns:1fr;padding:24px;gap:24px}
    .lb-prev{left:8px}.lb-next{right:8px}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">Handraw Gallery</div>
    <div class="meta">261 种手绘风格 · 本地化缓存 · 直链 yang0/handraw-style</div>
  </div>
  <nav class="anchors" id="anchors"></nav>
</header>
<main id="main"></main>

<div class="lb" id="lb">
  <button class="close" aria-label="close">✕</button>
  <button class="lb-nav lb-prev" aria-label="prev">‹</button>
  <button class="lb-nav lb-next" aria-label="next">›</button>
  <div class="lb-panel" id="lb-panel"></div>
</div>

<script>
const DATA = [{"num": 1, "section": "A", "author": "Gemma Correll", "name": "Playful Deadpan Doodle", "traits": "松散黑线、怪萌人物、少量点色、白底、日常吐槽与尴尬幽默；人物轮廓优先于细节堆砌，脸型、头身比例与手脚形状要形成清楚而独立的视觉语言；表情偏冷脸、尴尬或突然夸张，姿态要有明确喜剧节奏，避免统一的可爱微笑。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/001.png"}, {"num": 2, "section": "A", "author": "Saul Steinberg", "name": "Conceptual Continuous-Line Editorial", "traits": "极简线描、连续线、概念隐喻、人与空间一体化、智性幽默。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/002.png"}, {"num": 3, "section": "A", "author": "Jean-Jacques Sempé", "name": "Fine-Line Urban Miniature", "traits": "极细钢笔线、小人物大空间、大量留白、温柔法式都市幽默。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/003.png"}, {"num": 4, "section": "A", "author": "James Thurber", "name": "Awkward Minimal Ink Cartoon", "traits": "故意笨拙的极简线条、比例失衡、几笔成形、冷幽默。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/004.png"}, {"num": 5, "section": "A", "author": "Shel Silverstein", "name": "Childlike Free-Line Humor", "traits": "极简黑线、儿童式自由造型、荒诞动作、低细节。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/005.png"}, {"num": 6, "section": "A", "author": "Edward Gorey", "name": "Victorian Crosshatch Gothic Cartoon", "traits": "黑白钢笔、密集排线、维多利亚气息、古怪冷峻黑色幽默。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/006.png"}, {"num": 7, "section": "A", "author": "Ronald Searle", "name": "Frenetic Scratch-Ink Caricature", "traits": "狂躁钢笔、断裂墨线、细长人体、尖锐夸张、动态极强。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/007.png"}, {"num": 8, "section": "A", "author": "Roz Chast", "name": "Nervous Urban Notebook Cartoon", "traits": "神经质手绘、歪斜线条、手写文字、都市焦虑式喜剧；人物轮廓优先于细节堆砌，脸型、头身比例与手脚形状要形成清楚而独立的视觉语言；表情与肢体动作要服从该风格的人格机制，避免回落为统一的标准Q版表情。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/008.png"}, {"num": 9, "section": "A", "author": "Lynda Barry", "name": "Raw Zine Diary Cartoon", "traits": "粗糙手帐、Zine 感、手写字、原始情绪、反精致；人物轮廓优先于细节堆砌，脸型、头身比例与手脚形状要形成清楚而独立的视觉语言；保留纸纹、颗粒、套印或手工媒介的不完美，强化独立出版物的触感。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/009.png"}, {"num": 10, "section": "A", "author": "Tom Gauld", "name": "Geometric Literary Deadpan", "traits": "极小几何人物、极简场景、文学/科技梗、冷面幽默；脸部与服装主动做减法，依靠清楚轮廓、眼口和少量关键形状建立人物辨识度；表情偏冷脸、尴尬或突然夸张，姿态要有明确喜剧节奏，避免统一的可爱微笑。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/010.png"}, {"num": 11, "section": "A", "author": "David Shrigley", "name": "Deliberately Bad Absurd Doodle", "traits": "故意画坏、粗糙黑线、幼稚造型、荒诞文字、强 meme 感；人物轮廓优先于细节堆砌，脸型、头身比例与手脚形状要形成清楚而独立的视觉语言；表情偏冷脸、尴尬或突然夸张，姿态要有明确喜剧节奏，避免统一的可爱微笑。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/011.png"}, {"num": 12, "section": "A", "author": "Christoph Niemann", "name": "Minimal Visual-Pun Editorial", "traits": "极简概念设计、物体重解释、视觉双关、脑洞型构图；脸部与服装主动做减法，依靠清楚轮廓、眼口和少量关键形状建立人物辨识度；表情与肢体动作要服从该风格的人格机制，避免回落为统一的标准Q版表情。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/012.png"}, {"num": 13, "section": "A", "author": "Jean Jullien", "name": "Bold Flat Everyday Satire", "traits": "粗黑轮廓、扁平色块、现代人物、互联网生活讽刺；以醒目外轮廓和大形组织人物，五官少而有力，动作通过肩胯与手脚方向直接传达；表情偏冷脸、尴尬或突然夸张，姿态要有明确喜剧节奏，避免统一的可爱微笑。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/013.png"}, {"num": 14, "section": "A", "author": "Mr Bingo", "name": "Handwritten British Anti-Inspiration Cartoon", "traits": "随手钢笔、手写字、恶趣味、英式反鸡汤幽默；保留明显手绘笔压、停顿与轻微不齐整感，让轮廓产生真实纸上绘制的节奏；表情偏冷脸、尴尬或突然夸张，姿态要有明确喜剧节奏，避免统一的可爱微笑。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/014.png"}, {"num": 15, "section": "A", "author": "Brian Rea", "name": "Soft Relationship Editorial Line Art", "traits": "极简人物线稿、人与关系、柔和色块、生活型社论；脸部与服装主动做减法，依靠清楚轮廓、眼口和少量关键形状建立人物辨识度；配色控制在柔和低刺激色域，用少量点色区分层次，背景保持轻和干净。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/015.png"}, {"num": 16, "section": "A", "author": "Rubyetc", "name": "Raw Emotional Internet Doodle", "traits": "粗糙黑线、极简人体、心理情绪、自嘲式互联网漫画；脸部与服装主动做减法，依靠清楚轮廓、眼口和少量关键形状建立人物辨识度；保留纸纹、颗粒、套印或手工媒介的不完美，强化独立出版物的触感。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/016.png"}, {"num": 17, "section": "A", "author": "Sarah Andersen", "name": "Black-and-White Reaction Diary Cartoon", "traits": "黑白简线、圆眼反应表情、松散黑发、日常衣着；人物常与小动物或生活物件并置，依靠简单轮廓和大面积留白塑造轻松的生活漫画感。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/017.png"}, {"num": 18, "section": "A", "author": "Poorly Drawn Lines / Reza Farazmand", "name": "Minimal Deadpan Dialogue Cartoon", "traits": "极简圆头人物、面无表情、简单动物、灰蓝与米色小色块；人物和动物以干净轮廓置于白底中，靠冷淡姿态和微小关系制造荒诞幽默。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/018.png"}, {"num": 19, "section": "A", "author": "The Oatmeal / Matthew Inman", "name": "Explosive Webcomic Exaggeration", "traits": "粗黑线、夸张圆眼、张大嘴、头发和四肢大幅甩动；人物常与动物同框，以强烈动作、巨大表情和少量灰黑色块形成爆发式网络漫画效果。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/019.png"}, {"num": 20, "section": "A", "author": "Allie Brosh", "name": "Low-Fi Frenzy Cartoon", "traits": "粗糙鼠绘感、黑色乱发、极端大眼大嘴、粉色大色块、单人失控动作；保留低保真数字涂画的不规整轮廓和直接粗粝的互联网幽默。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/020.png"}, {"num": 21, "section": "A", "author": "Mari Andrew", "name": "Watercolor Handwritten Life Notes", "traits": "极简女性人物、细黑线、细长四肢、柔和水彩点染；以红色心形等单一物件承载生活情绪，画面保持白底、留白和轻微纸张质感。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/021.png"}, {"num": 22, "section": "A", "author": "Sally Nixon", "name": "Flat Everyday Women Lifestyle", "traits": "日常女性人物、蓬松手绘线稿、低饱和外套与围巾、旁边的小鸟；姿态自然站立，服装和动物用清楚色块区分，整体保留生活速写的轻松感。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/022.png"}, {"num": 23, "section": "A", "author": "Agathe Sorlet", "name": "Warm Minimal Female Line Cartoon", "traits": "黑色简线、黑色长发女性、坐姿、白上衣与蓝色牛仔裤；以少量暖色腮红和红色鞋带点亮画面，背景保持干净，气质亲密而松弛。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/023.png"}, {"num": 24, "section": "A", "author": "Jean-Michel Tixier", "name": "Geometric Fashion Deadpan", "traits": "夸张大头、松散黑色短线、冷面人物、横条纹上衣、灰黑与浅色块；人物比例故意不协调，依靠简化脸部和粗略纹理形成时尚而疏离的幽默感。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/024.png"}, {"num": 25, "section": "A", "author": "Gary Larson", "name": "One-Panel Absurd Social Cartoon", "traits": "单格漫画、极简黑线、细长人物与动物并置、荒诞社会情境；人物和动物以克制的姿态和少量灰绿色块呈现一本正经的反逻辑幽默。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/025.png"}, {"num": 26, "section": "A", "author": "Sergio Aragonés", "name": "Dense Silent Physical Comedy", "traits": "密集小动物和小人物、粗黑线、夸张鼻子与张嘴大笑、四肢向外伸展；画面充满无字肢体喜剧和拥挤的动作信息。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/026.png"}, {"num": 27, "section": "A", "author": "R. Crumb", "name": "Underground Crosshatched Grotesque Cartoon", "traits": "黑色密排线、粗重轮廓、坐姿人物、夸张而不修饰的人体比例；皮肤、头发和衣物依靠密集交叉排线塑造，带有地下漫画的粗粝与怪诞。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/027.png"}, {"num": 28, "section": "A", "author": "Daniel Clowes", "name": "Retro Detached American Comic", "traits": "黑色齐肩直发、方形眼镜、条纹上衣与绿色外套、冷静平涂色块；人物正面站立、表情疏离，画面具有复古美式成人漫画的克制感。", "img": "https://raw.githubusercontent.com/yang0/handraw-style/master/images/individual/001-200/028.png"}, {"num": 29, "section": "A", "author": "Chris Ware", "name": "Geometric Diagrammatic Narrative", "tra const BASE = https://young920.github.io/handraw-gallery/;
const SECTION_TITLES = {
  A: '国际社论漫画 / 幽默手绘',
  B: '国际绘本 / 叙事型手绘',
  C: '现代平面 / 艺术化人物体系',
  D: '日本作者 / 当代插画体系',
  E: '中国作者 / 当代插画体系',
  F: '通用网感 / 媒介 / 地域手绘',
  G: '附件新增 / 当代插画补充',
};
const SECTION_COUNTS = {A:0,B:0,C:0,D:0,E:0,F:0,G:0};
DATA.forEach(e => SECTION_COUNTS[e.section]++);

// 顶部锚点
const anchorsEl = document.getElementById('anchors');
'ABCDEFG'.split('').forEach(s => {
  if (!SECTION_COUNTS[s]) return;
  const a = document.createElement('a');
  a.href = `#sec-${s}`;
  a.innerHTML = `${s}<span class="n">(${SECTION_COUNTS[s]})</span>`;
  anchorsEl.appendChild(a);
});

const main = document.getElementById('main');
'ABCDEFG'.split('').forEach(s => {
  const items = DATA.filter(e => e.section === s).sort((a,b)=>a.num-b.num);
  if (!items.length) return;
  const secEl = document.createElement('section');
  secEl.className = 'section-block';
  secEl.id = `sec-${s}`;
  secEl.innerHTML = `
    <h2>${s} · ${SECTION_TITLES[s]}</h2>
    <p class="sub">${SECTION_COUNTS[s]} 个编号 · #${String(items[0].num).padStart(3,'0')} – #${String(items.at(-1).num).padStart(3,'0')}</p>
    <div class="tile-grid">${items.map(e => `
      <div class="tile" data-num="${e.num}">
        <div class="img-wrap">
          <span class="num-badge">#${String(e.num).padStart(3,'0')}</span>
          <img src="${e.img}"
               alt="#${e.num} ${e.name}"
               loading="lazy" decoding="async"
               onerror="this.onerror=null;this.src='${e.img}'">
        </div>
        <div class="name">${e.name}</div>
      </div>`).join('')}
    </div>`;
  main.appendChild(secEl);
});

const lb = document.getElementById('lb');
const lbPanel = document.getElementById('lb-panel');
let curIdx = -1;

main.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile) openLb(parseInt(tile.dataset.num));
});

function openLb(num) {
  curIdx = DATA.findIndex(x => x.num === num);
  if (curIdx < 0) return;
  renderLb();
  lb.classList.add('open');
}

function renderLb() {
  const e = DATA[curIdx];
  const promptCn = `风格名称：#${String(e.num).padStart(3,'0')} · ${e.name}。\n${e.traits}`;
  lbPanel.innerHTML = `
    <div class="lb-img">
      <img src="${e.img}"
           alt="#${e.num} ${e.name}"
           onerror="this.onerror=null;this.src='${e.img}'">
    </div>
    <div class="lb-meta">
      <div class="num">#${String(e.num).padStart(3,'0')} · ${e.section} 类 · ${curIdx+1}/${DATA.length}</div>
      <div class="name">${e.name}</div>
      <div class="author">作者索引 · ${e.author}</div>
      <div class="prompt-block">
        <div class="label">中文 Prompt（可复制）</div>
        <pre>${esc(promptCn)}</pre>
        <div class="label">English Prompt</div>
        <pre>${esc(`Style: #${String(e.num).padStart(3,'0')} · ${e.name} (by ${e.author}). ${e.traits}`)}</pre>
        <div class="label">原图 URL（yang0/handraw-style）</div>
        <pre>${esc(e.img)}</pre>
      </div>
    </div>`;
}

function closeLb(){ lb.classList.remove('open') }
function navLb(delta) {
  if (curIdx < 0) return;
  curIdx = (curIdx + delta + DATA.length) % DATA.length;
  renderLb();
}

lb.addEventListener('click', e => {
  if (e.target === lb) closeLb();
  if (e.target.classList.contains('close')) closeLb();
  if (e.target.classList.contains('lb-prev')) navLb(-1);
  if (e.target.classList.contains('lb-next')) navLb(1);
});
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
</script>
